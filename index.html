<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kriens Family – Microphone Test</title><style>body{font:16px system-ui,-apple-system,sans-serif;background:#edf3f9;color:#193451;margin:0;padding:20px}.card{max-width:540px;margin:30px auto;background:white;padding:25px;border-radius:16px;box-shadow:0 6px 24px #1232}button{border:0;border-radius:9px;padding:13px 18px;margin:6px 5px 6px 0;background:#175b9b;color:white;font:inherit}button:disabled{opacity:.45}audio{display:block;width:100%;margin-top:18px}#status{white-space:pre-wrap;line-height:1.5}small{color:#566}</style></head><body><main class="card"><h2>🇨🇭 Kriens Family – Kiểm tra microphone</h2><p>Thử ghi âm trực tiếp trong Safari trước khi triển khai Family v3.</p><button id="start">🎙️ Bắt đầu ghi âm</button><button id="stop" disabled>⏹ Dừng ghi âm</button><p id="status" role="status">Sẵn sàng kiểm tra.</p><audio id="playback" controls hidden></audio><small>Âm thanh chỉ được giữ tạm trong trình duyệt, không tải lên máy chủ. Hãy nhấn Dừng để nghe lại.</small></main><script>
let recorder,stream,chunks=[],audioUrl;const start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),playback=document.getElementById('playback');
start.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Trình duyệt không hỗ trợ getUserMedia hoặc trang không chạy qua HTTPS');if(!window.MediaRecorder)throw new Error('Trình duyệt không hỗ trợ MediaRecorder');stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'audio/mp4'});if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);playback.src=audioUrl;playback.hidden=false;status.textContent='✅ Đã ghi âm. Nhấn nút phát bên dưới để nghe lại.';stream.getTracks().forEach(t=>t.stop());start.disabled=false;stop.disabled=true};recorder.start();status.textContent='🔴 Đang ghi âm... Hãy nói một câu tiếng Đức.';start.disabled=true;stop.disabled=false}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());status.textContent='❌ '+e.name+': '+e.message;start.disabled=false;stop.disabled=true}};
stop.onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
</script></body></html>
