<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch A2–B2</title>
<meta name="referrer" content="no-referrer">

<meta name="apple-mobile-web-app-title" content="Deutsch">
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1b2235;--mute:#687086;--pri:#1f3f8f;--pri-soft:#e8edfa;--gold:#e8a400;--gold-soft:#fff5d9;
  --ok:#1f9d55;--ok-soft:#e5f6ec;--bad:#d64545;--bad-soft:#fdecec;--line:#e1e4ec;
  --der:#2563eb;--die:#d63a3a;--das:#159a4c;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .flag{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-right:6px;background:linear-gradient(#111 33%,#d00 33% 66%,#fc0 66%);border-radius:2px}
.chip{background:rgba(255,255,255,.16);border:0;border-radius:20px;padding:6px 12px;color:#fff;font-size:15px;cursor:pointer;white-space:nowrap}
#sync{font-size:12px;opacity:.8}
main{max-width:680px;margin:0 auto;padding:14px 16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;cursor:pointer}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:14px 0 6px}
.mute{color:var(--mute)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.gold{background:var(--gold);color:#241a00}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.btn.block{display:block;width:100%;margin-top:8px}
.btn:disabled{opacity:.45}
.btn.rec{background:var(--bad)}
.btn.rec.recording{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.ic{border:0;background:var(--pri-soft);color:var(--pri);border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;flex:0 0 auto}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}
.badge{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.gold{background:var(--gold-soft);color:#8a5a00}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--pri-soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pri)}
.stat span{font-size:12px;color:var(--mute)}
.fc{min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.fc .word{font-size:30px;font-weight:700;margin:6px 0;word-break:break-word}
.fc .vi{font-size:20px;margin:6px 0}
.fc .ex{font-size:16px;margin-top:10px;color:#333}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}
.forms{font-size:14px;color:var(--mute);margin-top:4px}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.grade .btn{padding:13px 6px}
.ex-line{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.ex-line:last-child{border-bottom:0}
.ex-line .de{font-weight:600}
.ex-line .tr{font-size:14px;color:var(--mute)}
table.g{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
table.g td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.g td:first-child{font-weight:600;background:#fafbfe;width:38%}
ul.ex{padding-left:20px;margin:6px 0}
ul.ex li{margin:4px 0}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;margin:6px 0;cursor:pointer;font-size:16px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:6px;border:1px dashed var(--line);border-radius:11px;margin:6px 0}
.chips button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:15px;cursor:pointer}
.chips.built button{background:var(--pri-soft);border-color:var(--pri-soft)}
.q-s{font-size:18px;margin:6px 0 10px}
input.tx,textarea.tx,select.tx{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;background:#fff}
textarea.tx{min-height:200px;resize:vertical}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.dlg .ln{display:flex;gap:8px;padding:6px 0;align-items:flex-start}
.dlg .who{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--pri)}
.dlg .who.B,.dlg .who.U{background:var(--gold);color:#241a00}
.dlg .who.C{background:#7a54c7}
.dlg .ln.now{background:var(--gold-soft);border-radius:8px}
.blur{filter:blur(5px);user-select:none}
.model{white-space:pre-wrap;background:#fafbfe;border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin-top:8px}
.diff .ok{color:var(--ok);font-weight:600}.diff .bad{color:var(--bad);text-decoration:line-through}.diff .miss{color:var(--bad);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);background:#222a;backdrop-filter:blur(4px);background:rgba(25,30,45,.92);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;font-size:14px}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.ov .sheet{background:#fff;width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.mem{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:6px 0;font-size:17px;cursor:pointer}
.mem.on{border-color:var(--pri);background:var(--pri-soft)}
.fam td{padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;text-align:center}
.fam td:first-child{text-align:left}
.fam{width:100%;border-collapse:collapse}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#f1f2f6;border-radius:5px;padding:1px 5px}
.check{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.check input{margin-top:4px;width:18px;height:18px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.hl{background:var(--gold-soft);border-radius:4px;padding:0 3px}
</style>
</head>
<body>
<header>
  <h1><span class="flag"></span><span id="h-title">Deutsch A2–B2</span></h1>
  <span id="sync"></span>
  <button class="chip" id="who">👤 Chọn người</button>
</header>
<main id="main"><div class="card"><p class="mute">Đang tải…</p></div></main>
<nav id="nav">
  <button data-tab="home" class="on"><span>🏠</span>Học</button>
  <button data-tab="vocab"><span>🃏</span>Từ vựng</button>
  <button data-tab="gram"><span>📐</span>Ngữ pháp</button>
  <button data-tab="hear"><span>🎧</span>Nghe</button>
  <button data-tab="speak"><span>🗣️</span>Nói</button>
  <button data-tab="write"><span>✍️</span>Viết</button>
</nav>
<div id="toast" class="hidden"></div>
<div id="ov" class="ov hidden"><div class="sheet" id="ov-body"></div></div>

<script>
'use strict';
/* =====================================================================
 * Deutsch A2–B2 – app học tiếng Đức cho cả nhà.
 * Dữ liệu bài học: data/*.json (tĩnh). Tiến độ + audio ElevenLabs: Apps Script (Deutsch.gs).
 * ===================================================================== */
const V = '20261113b';
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzSZ02Kpb7Fo_6y9aNIbtrq27O_OA0T8KlBT-CSD7nDxbAO8NkySs3-PlUc3BbEzWk/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const API_URL = new URLSearchParams(location.search).get('api') || store.get('kriens_api', '') || DEFAULT_API_URL;
function run(fn, ...args) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), redirect: 'follow' })
    .then(r => r.text()).then(t => {
      let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Apps Script chưa có phần Deutsch (hãy dán Deutsch.gs và triển khai phiên bản mới).'); }
      if (!j.ok) throw new Error(j.error || 'Lỗi Apps Script');
      return j.result;
    });
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3200); }
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
const dateKey = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

/* ============================== TRẠNG THÁI ============================== */
const S = {
  tab: 'home', member: store.get('de_member', ''), members: [], family: {}, D: {}, amap: store.get('de_amap', {}),
  audioStatus: {}, rate: store.get('de_rate', 1), view: null, online: true
};
const P = {};       // tiến độ của người đang học: { srs_A2: {id:[box,due,lapses]}, gram:{}, sp:{}, wr:{}, st:{}, rec:{} }
const PTS = {};     // thời điểm sửa mỗi mục
const DIRTY = new Set();
const SRS_KEYS = ['A2', 'T', 'B1', 'NV', 'VP', 'AP', 'KO'];
const INTERVALS = [0, 1, 2, 4, 8, 16, 35, 80, 180];

function encodeKey(k, v) {
  if (k.startsWith('srs_')) return Object.entries(v).map(([id, a]) => id + ',' + a.join(',')).join(';');
  return JSON.stringify(v);
}
function decodeKey(k, s) {
  if (k.startsWith('srs_')) {
    const o = {};
    String(s || '').split(';').forEach(p => { if (!p) return; const a = p.split(','); o[a[0]] = a.slice(1).map(Number); });
    return o;
  }
  try { return JSON.parse(s || '{}') || {}; } catch (e) { return {}; }
}
function defaults() {
  SRS_KEYS.forEach(d => { P['srs_' + d] = P['srs_' + d] || {}; });
  ['gram', 'sp', 'wr', 'st', 'rec'].forEach(k => { P[k] = P[k] || {}; });
  P.st.days = P.st.days || {}; P.st.newPerDay = P.st.newPerDay || 10;
}
function loadLocal(member) {
  Object.keys(P).forEach(k => delete P[k]);
  const loc = store.get('de_p_' + member, {});
  Object.entries(loc).forEach(([k, o]) => { P[k] = decodeKey(k, o.v); PTS[k] = o.ts || 0; });
  defaults();
}
function saveLocal() {
  if (!S.member) return;
  const o = {};
  Object.keys(P).forEach(k => { o[k] = { v: encodeKey(k, P[k]), ts: PTS[k] || 0 }; });
  store.set('de_p_' + S.member, o);
}
function mergeServer(member) {
  const srv = S.family[member] || {};
  let changed = false;
  Object.entries(srv).forEach(([k, o]) => {
    if ((o.ts || 0) > (PTS[k] || 0)) { P[k] = decodeKey(k, o.v); PTS[k] = o.ts; changed = true; }
    else if ((PTS[k] || 0) > (o.ts || 0)) DIRTY.add(k);
  });
  Object.keys(PTS).forEach(k => { if (!srv[k] && PTS[k]) DIRTY.add(k); });
  defaults();
  if (changed) saveLocal();
  if (DIRTY.size) scheduleSync();
}
function touch(k) { PTS[k] = Date.now(); DIRTY.add(k); saveLocal(); scheduleSync(); }
let syncT = null, syncing = false;
function scheduleSync() { clearTimeout(syncT); syncT = setTimeout(syncNow, 2500); }
async function syncNow() {
  if (syncing || !S.member || !DIRTY.size) return;
  syncing = true; $('#sync').textContent = '⟳';
  const who = S.member;
  try {
    for (const k of Array.from(DIRTY)) {
      const v = encodeKey(k, P[k]), ts = PTS[k];
      await run('de_save', who, k, v, ts);
      DIRTY.delete(k);
      (S.family[who] = S.family[who] || {})[k] = { v, ts };
    }
    $('#sync').textContent = '✓';
  } catch (e) { $('#sync').textContent = '⚠︎'; }
  syncing = false;
  if (DIRTY.size) scheduleSync();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) syncNow(); });
function logStudy(n) {
  const d = dateKey();
  P.st.days[d] = (P.st.days[d] || 0) + (n || 1);
  touch('st');
}
function streak(st) {
  const days = (st && st.days) || {};
  let n = 0; const t = new Date();
  for (let i = 0; i < 400; i++) {
    const d = new Date(t.getTime() - i * 86400000 - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (days[d]) n++; else if (i > 0) break;
  }
  return n;
}

/* ============================== AUDIO ============================== */
const AUD = new Audio(); AUD.preload = 'auto'; AUD.setAttribute('playsinline', '');
let unlocked = false;
const SILENT = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
function unlockAudio() {
  if (unlocked) return;
  try { if (AUD.paused) { AUD.src = SILENT; const p = AUD.play(); if (p && p.then) p.then(() => { unlocked = true; }).catch(() => {}); } } catch (e) {}
}
document.addEventListener('touchend', unlockAudio, true);
document.addEventListener('click', unlockAudio, true);
const MEM = {};                      // fileId → objectURL
let CACHE = null;
async function cacheOpen() { if (CACHE !== null) return CACHE; try { CACHE = await caches.open('de-audio-v1'); } catch (e) { CACHE = false; } return CACHE; }
async function fromCache(id) {
  if (MEM[id]) return MEM[id];
  const c = await cacheOpen(); if (!c) return null;
  try { const r = await c.match('/a/' + id); if (r) { MEM[id] = URL.createObjectURL(await r.blob()); return MEM[id]; } } catch (e) {}
  return null;
}
async function putData(id, dataUri) {
  const blob = await (await fetch(dataUri)).blob();
  MEM[id] = URL.createObjectURL(blob);
  const c = await cacheOpen();
  if (c) { try { await c.put('/a/' + id, new Response(blob, { headers: { 'Content-Type': blob.type } })); } catch (e) {} }
  return MEM[id];
}
const pending = new Map();
/** Tải trước (tối đa 25 file / lần) để phát ngay không phải chờ. */
async function prefetch(keys) {
  const ids = [];
  for (const k of keys) {
    const id = S.amap[k];
    if (!id || MEM[id] || pending.has(id)) continue;
    if (await fromCache(id)) continue;
    ids.push(id);
  }
  for (let i = 0; i < ids.length; i += 25) {
    const part = ids.slice(i, i + 25);
    const pr = run('de_audio', part).then(async res => { for (const id of part) if (res[id]) await putData(id, res[id]); })
      .catch(() => {}).finally(() => part.forEach(id => pending.delete(id)));
    part.forEach(id => pending.set(id, pr));
    await pr;
  }
}
async function srcFor(key) {
  const id = S.amap[key];
  if (!id) return null;
  if (MEM[id]) return MEM[id];
  const c = await fromCache(id); if (c) return c;
  if (pending.has(id)) { await pending.get(id); return MEM[id] || null; }
  await prefetch([key]);
  return MEM[id] || null;
}
let playTok = 0;
function stopAudio() {
  playTok++;
  try { speechSynthesis.cancel(); } catch (e) {}
  if (AUD._fin) AUD._fin();
  try { AUD.pause(); } catch (e) {}
}
function playUrl(url, rate) {
  return new Promise(res => {
    if (AUD._fin) AUD._fin();
    let done = false;
    const fin = () => { if (done) return; done = true; AUD.onended = AUD.onerror = AUD.onpause = null; if (AUD._fin === fin) AUD._fin = null; res(); };
    AUD._fin = fin; AUD.onended = fin; AUD.onerror = fin;
    AUD.src = url; AUD.playbackRate = AUD.defaultPlaybackRate = rate || S.rate;
    const p = AUD.play();
    if (p && p.then) p.then(() => { unlocked = true; AUD.playbackRate = rate || S.rate; AUD.onpause = fin; }).catch(fin); else AUD.onpause = fin;
  });
}
let deVoice = null;
function pickVoice(lang) {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang === lang + '-CH') || vs.find(v => v.lang === lang + '-DE') || vs.find(v => (v.lang || '').startsWith(lang));
}
function tts(text, lang) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) return res();
    const u = new SpeechSynthesisUtterance(text);
    lang = lang || 'de';
    const v = lang === 'de' ? (deVoice = deVoice || pickVoice('de')) : pickVoice(lang);
    if (v) u.voice = v;
    u.lang = v ? v.lang : (lang === 'de' ? 'de-DE' : lang);
    u.rate = 0.95 * S.rate;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
    setTimeout(res, 2000 + text.length * 120);
  });
}
/** Phát câu theo mã audio; nếu chưa có file ElevenLabs thì đọc bằng giọng máy. */
async function say(key, text) {
  const my = ++playTok;
  try { speechSynthesis.cancel(); } catch (e) {}
  const url = key ? await srcFor(key) : null;
  if (my !== playTok) return false;
  if (url) await playUrl(url); else await tts(text);
  return my === playTok;
}
function sayBtn(key, text, cls) {
  return `<button class="ic ${cls || ''}" data-say="${esc(key || '')}" data-text="${esc(text)}" title="Nghe">🔊</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');

/* ---------- Nhận dạng giọng nói (nếu trình duyệt hỗ trợ) ---------- */
const SRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  return new Promise((res, rej) => {
    if (!SRec) return rej(new Error('Trình duyệt này không hỗ trợ nhận dạng giọng nói.'));
    stopAudio();
    const r = new SRec(); r.lang = 'de-DE'; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    let got = false;
    r.onresult = e => { got = true; res(Array.from(e.results[0]).map(a => a.transcript)); };
    r.onerror = e => rej(new Error(e.error === 'not-allowed' ? 'Chưa cho phép micro.' : e.error === 'no-speech' ? 'Không nghe thấy gì.' : e.error));
    r.onend = () => { if (!got) res([]); };
    r.start();
  });
}
const norm = s => String(s || '').toLowerCase().replace(/ß/g, 'ss').replace(/[.,!?;:«»„“"'()–—-]/g, ' ').replace(/\s+/g, ' ').trim();
function similarity(a, b) {
  const x = norm(a).split(' '), y = norm(b).split(' ');
  const dp = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = 1; i <= x.length; i++) for (let j = 1; j <= y.length; j++) dp[i][j] = x[i - 1] === y[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  return Math.round(dp[x.length][y.length] / Math.max(x.length, y.length, 1) * 100);
}
/** So sánh từng từ: trả HTML tô xanh/đỏ. */
function diffHtml(target, said) {
  const x = String(target).split(/\s+/), y = norm(said).split(' ');
  const xs = x.map(w => norm(w));
  const dp = Array.from({ length: xs.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = xs.length - 1; i >= 0; i--) for (let j = y.length - 1; j >= 0; j--) dp[i][j] = xs[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0; const out = [];
  while (i < xs.length) {
    if (j < y.length && xs[i] === y[j]) { out.push(`<span class="ok">${esc(x[i])}</span>`); i++; j++; }
    else if (j < y.length && dp[i][j + 1] >= dp[i + 1][j]) { out.push(`<span class="bad">${esc(y[j])}</span>`); j++; }
    else { out.push(`<span class="miss">${esc(x[i])}</span>`); i++; }
  }
  while (j < y.length) out.push(`<span class="bad">${esc(y[j++])}</span>`);
  return out.join(' ');
}
function srBtn(target, outSel) {
  if (!SRec) return '';
  return `<button class="ic" data-sr="${esc(target)}" data-out="${esc(outSel)}" title="Nói để máy nghe">🎤</button>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-sr]');
  if (!b) return;
  e.stopPropagation();
  const out = document.querySelector(b.dataset.out);
  if (out) { out.classList.remove('hidden'); out.innerHTML = '🎤 Đang nghe… hãy nói.'; }

    out.innerHTML = `<div class="diff">${diffHtml(b.dataset.sr, best[0])}</div><div class="small mute">Máy nghe: “${esc(best[0])}” – khớp ${best[1]}%</div>`;
    if (best[1] >= 80) logStudy(1);
  } catch (err) { if (out) out.textContent = err.message; }
});

async function toggleRec(btn) {
  const box = btn.closest('.rec-box');
  if (R.rec && R.rec.state === 'recording') { R.rec.stop(); return; }
  stopAudio();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { box.querySelector('[data-recmsg]').textContent = 'Không mở được micro – hãy cho phép micro cho trang này (Safari: aA › Cài đặt trang web › Micro).'; return; }
  R.chunks = []; R.key = box.dataset.key;
  R.rec = new MediaRecorder(stream);
  R.rec.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
  R.rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(R.iv);
    if (R.url) URL.revokeObjectURL(R.url);
    R.blob = new Blob(R.chunks, { type: R.rec.mimeType || 'audio/mp4' }); R.url = URL.createObjectURL(R.blob);
    btn.textContent = '⏺ Ghi lại'; btn.classList.remove('recording');
    box.querySelector('[data-recplay]').disabled = false; box.querySelector('[data-recsave]').disabled = false;
    box.querySelector('[data-recmsg]').textContent = 'Đã ghi. Nghe lại, so với bài mẫu, hoặc bấm “Lưu” để giữ trên Google Drive.';
    logStudy(1);
  };
  R.t0 = Date.now(); R.rec.start();
  btn.textContent = '⏹ Dừng'; btn.classList.add('recording');
  const tm = box.querySelector('[data-rectime]');
  R.iv = setInterval(() => { const s = Math.floor((Date.now() - R.t0) / 1000); tm.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 500);
  box.querySelector('[data-recmsg]').textContent = 'Đang ghi… nói xong bấm “Dừng”.';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rec],[data-recplay],[data-recsave],[data-recold]');
  if (!b) return;
  if (b.dataset.rec !== undefined) return toggleRec(b);
  if (b.dataset.recplay !== undefined && R.url) { stopAudio(); return playUrl(R.url, 1); }
  if (b.dataset.recold) { stopAudio(); srcForId(b.dataset.recold).then(u => u ? playUrl(u, 1) : toast('Không tải được bản ghi.')); return; }
  if (b.dataset.recsave !== undefined && R.blob) {
    const box = b.closest('.rec-box'), key = box.dataset.key, who = S.member;
    b.disabled = true; box.querySelector('[data-recmsg]').textContent = 'Đang lưu lên Google Drive…';
    const fr = new FileReader();
    fr.onload = () => run('de_saveRec', fr.result, key, who).then(r => {
      P.rec[key] = r.id; touch('rec');
      box.querySelector('[data-recmsg]').textContent = '✅ Đã lưu vào Drive (Deutsch_GhiAm/' + who + ').';
    }).catch(err => { b.disabled = false; box.querySelector('[data-recmsg]').textContent = 'Lưu thất bại: ' + err.message; });
    fr.readAsDataURL(R.blob);
  }
});
async function srcForId(id) {

function srsStats(srs, cards, member) {
  const t = today(); let seen = 0, mastered = 0, due = 0;
  cards.forEach(c => { const a = srs[c.id]; if (!a) return; seen++; if (a[0] >= 5) mastered++; if (a[1] <= t) due++; });
  return { seen, mastered, due, total: cards.length };
}
function deckCards(d) { return S.D.vocab.cards.filter(c => c.d === d); }
function famRow(name) {
  const fam = S.family[name] || {};
  const get = k => name === S.member ? P[k] : decodeKey(k, fam[k] && fam[k].v);
  let seen = 0, mastered = 0;
  SRS_KEYS.forEach(d => { const s = get('srs_' + d) || {}; Object.values(s).forEach(a => { seen++; if (a[0] >= 5) mastered++; }); });
  const g = get('gram') || {}, sp = get('sp') || {}, st = get('st') || {};
  const gd = Object.values(g).filter(x => x && x.best >= 70).length;
  return { seen, mastered, gd, sp: Object.keys(sp).length, streak: streak(st), todayN: (st.days || {})[dateKey()] || 0 };
}

  if (btn.dataset.on) { stopAudio(); btn.dataset.on = ''; btn.textContent = '▶ Nghe liên tục'; return; }
  btn.dataset.on = '1'; btn.textContent = '⏹ Dừng';
  const tok = ++playTok;
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    prefetch(list.slice(i, i + 6).flatMap(x => [x.aw, x.ae]));
    btn.textContent = '⏹ ' + (i + 1) + '/' + list.length + ': ' + c.w.split(',')[0];
    for (const [k, t] of [[c.aw, c.w.split(',')[0]], [c.ae, c.ex]]) {
      const url = await srcFor(k);
      if (tok !== playTok) return;
      if (url) await playUrl(url); else await tts(t);
      if (tok !== playTok) return;
      await sleep(700);
    }
    if ('speechSynthesis' in window && pickVoice('vi')) await tts(c.vi.split(/[;(]/)[0], 'vi');
    if (tok !== playTok) return;
    await sleep(900);
  }
  btn.dataset.on = ''; btn.textContent = '▶ Nghe liên tục';
}

/* ---------- Phiên học thẻ ---------- */
function startSession(deckId) {
  const t = today(), decks = deckId ? [deckId] : SRS_KEYS;
  const due = [], fresh = [];
  decks.forEach(d => {
    const srs = P['srs_' + d];
    deckCards(d).forEach(c => { const a = srs[c.id]; if (a) { if (a[1] <= t) due.push([a[1], c]); } else fresh.push(c); });
  });
  due.sort((a, b) => a[0] - b[0]);
  const nNew = Math.max(0, P.st.newPerDay - newToday());
  // Từ mới: thứ tự xáo trộn cố định cho từng người (không học theo vần A-B-C)
  const h = id => { let x = 2166136261; for (const ch of id + S.member) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; };
  fresh.sort((p, q) => h(p.id) - h(q.id));
  const order = deckId ? fresh : SRS_KEYS.flatMap(d => fresh.filter(c => c.d === d));
  const q = shuffle(due.slice(0, 60).map(x => x[1])).concat(order.slice(0, nNew));
  if (!q.length) { toast('Hôm nay đã học xong 🎉 – có thể tăng “Số từ mới mỗi ngày” ở trang Học.'); return; }
  S.tab = 'vocab'; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'vocab'));
  S.view = { session: { q, i: 0, flip: false, mode: store.get('de_mode', 'de'), deck: deckId, done: 0, again: new Set() } };
  render();
}

      <p class="small mute" style="text-align:center">${isNew ? 'Từ mới' : 'Ô ' + a[0]} → Nhớ: ôn lại sau ${INTERVALS[Math.min((a ? a[0] : 0) + 1, 8)]} ngày</p>`

  };

  if (!ss.flip) $('#fc').onclick = e => { if (ss.mode !== 'type' && !e.target.closest('button')) flip(); };
  m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(c, Number(b.dataset.g)));
}
function grade(c, g) {
  const ss = S.view.session, key = 'srs_' + c.d, srs = P[key], t = today();
  const a = srs[c.id];
  if (!a) { P.st.newCount = newToday() + 1; P.st.newDay = t; }
  let box = a ? a[0] : 0, lapses = a ? (a[2] || 0) : 0;
  if (g === 0) {
    box = a && box > 0 ? 1 : 0; lapses++;
    if (!ss.again.has(c.id)) { ss.again.add(c.id); ss.q.splice(Math.min(ss.i + 4, ss.q.length), 0, c); }
  } else box = Math.min(8, box + g);
  srs[c.id] = [box, g === 0 ? t : t + INTERVALS[box], lapses];
  touch(key); logStudy(1);
  ss.i++; ss.done++; ss.flip = false; render();
}

function checkText(t, formal) {

  if (!/^(sehr geehrte|liebe|lieber|hallo|guten tag|grüezi)/i.test(t.trim())) tips.push('Thiếu lời chào mở đầu (Sehr geehrte … / Liebe … / Hallo …).');
  if (!/(grüsse|grüße|gruss|gruß|bis bald|tschüss)/i.test(t)) tips.push('Thiếu câu kết (Freundliche Grüsse / Liebe Grüsse).');
  if (formal && /\b(du|dich|dir|dein)\b/i.test(t)) tips.push('Thư trang trọng nên dùng “Sie/Ihnen/Ihr”, không dùng “du”.');
  if (!formal && /\bSie\b/.test(t) && !/\b(du|dir|dich)\b/i.test(t)) tips.push('E-mail thân mật thường dùng “du”.');
  if (/ß/.test(t)) tips.push('Ở Thụy Sĩ viết “ss” thay cho “ß” (cả hai đều được chấp nhận trong bài thi).');
  const sents = t.split(/[.!?]+/).filter(s => s.trim().split(/\s+/).length > 2);
  if (sents.some(s => /\b(weil|dass|wenn|ob)\b/.test(s) && !/\b\w+(e|en|t|st|n)\s*$/.test(s.trim()))) tips.push('Kiểm tra lại động từ ở cuối mệnh đề sau weil / dass / wenn.');
  return { words, tips };
}

    <div class="model hidden" id="md">${esc(x.m)}<div style="margin-top:8px">${sayBtn(x.am, x.m.replace(/\n/g, ' '))} <span class="small mute">Nghe bài mẫu</span></div></div>
    <button class="btn ok block" id="done">✓ Đã viết xong</button></div>
    <div class="card"><h2>Mẫu câu</h2>${S.D.write.bausteine.filter(g => formal ? !/thân mật/.test(g.t) : !/trang trọng/.test(g.t)).map(g => `<h3>${esc(g.t)}</h3>${g.l.map(l => `<div class="ex-line" data-ins="${esc(l[0])}" style="cursor:pointer"><div><div class="de">${esc(l[0])}</div><div class="tr">${esc(l[1])}</div></div></div>`).join('')}`).join('')}<p class="small mute">Chạm vào một mẫu câu để chèn vào bài.</p></div>`;
  onBack(() => { S.view = { sec: 'mail' }; render(); });
  const ta = $('#txt'), wc = () => { $('#wc').textContent = (ta.value.match(/\S+/g) || []).length + ' từ'; };
  wc();
  let t; ta.oninput = () => { wc(); clearTimeout(t); t = setTimeout(() => { P.wr[x.id] = Object.assign(P.wr[x.id] || {}, { text: ta.value.slice(0, 4000) }); touch('wr'); }, 1200); };
  m.querySelectorAll('[data-lp]').forEach(c => c.onchange = () => { const s = P.wr[x.id] = P.wr[x.id] || {}; s.lp = s.lp || []; s.lp[Number(c.dataset.lp)] = c.checked ? 1 : 0; touch('wr'); });
  $('#chk').onclick = () => {
    const r = checkText(ta.value, formal), done = m.querySelectorAll('[data-lp]:checked').length;
    const tips = r.tips.slice();
    if (done < lp.length) tips.unshift('Còn ' + (lp.length - done) + ' ý trong nhiệm vụ chưa đánh dấu là đã viết.');
    $('#tips').innerHTML = `<div class="fb ${tips.length ? 'bad' : 'ok'}">${tips.length ? tips.map(esc).join('<br>') : '✓ Bố cục ổn: có chào, đủ ý, có lời kết. Giờ so với bài mẫu nhé.'}</div>`;
  };
  $('#model').onclick = () => $('#md').classList.toggle('hidden');
  $('#done').onclick = () => { P.wr[x.id] = Object.assign(P.wr[x.id] || {}, { text: ta.value.slice(0, 4000), done: 1 }); touch('wr'); logStudy(1); toast('Đã lưu ✓'); };
  m.querySelectorAll('[data-ins]').forEach(el => el.onclick = () => {
    const s = ta.selectionStart || ta.value.length;
    ta.value = ta.value.slice(0, s) + el.dataset.ins + ' ' + ta.value.slice(s); ta.focus(); ta.oninput();
  });
}
function renderForm(m, x) {
  const st = P.wr[x.id] || {};
  m.innerHTML = `${back('Mẫu đơn')}<div class="card" style="margin-top:10px"><h2>📋 ${esc(x.t)}</h2><p>${esc(x.vi)}</p>
    ${x.fields.map((f, i) => `<label class="small mute">${esc(f)}</label><input class="tx" data-f="${i}" value="${esc((st.f || [])[i] || '')}" style="margin:2px 0 8px">`).join('')}
    <label class="small mute">Fragen und Bemerkungen (3 câu)</label><textarea class="tx" id="bem" style="min-height:120px" lang="de">${esc(st.text || '')}</textarea>
    <button class="btn ghost block" id="model">📄 Xem mẫu</button><div class="model hidden" id="md">${esc(x.m)}</div>
    <button class="btn ok block" id="done">✓ Đã làm xong</button></div>`;
  onBack(() => { S.view = { sec: 'form' }; render(); });
  $('#model').onclick = () => $('#md').classList.toggle('hidden');
  $('#done').onclick = () => {
    P.wr[x.id] = { f: Array.from(m.querySelectorAll('[data-f]')).map(i => i.value.slice(0, 100)), text: $('#bem').value.slice(0, 1500), done: 1 };
    touch('wr'); logStudy(1); toast('Đã lưu ✓');
  };
}
function renderLesen(m, x) {
  m.innerHTML = `${back('Đọc hiểu')}<div class="card" style="margin-top:10px"><h2>📰 ${esc(x.t)}</h2><div class="model" style="border-color:var(--pri)">${esc(x.txt)}</div>
    <h3>Tìm thông tin</h3>${x.q.map((q, i) => `<div class="ex-line"><div class="grow"><div class="de">${i + 1}. ${esc(q[0])}</div><div class="tr hidden" id="la${i}">→ ${esc(q[1])}</div></div><button class="btn ghost sm" data-a="${i}">Đáp án</button></div>`).join('')}</div>`;
  onBack(() => { S.view = { sec: 'lesen' }; render(); });
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { $('#la' + b.dataset.a).classList.toggle('hidden'); logStudy(1); });
}

/* ============================== KHỞI ĐỘNG ============================== */
async function loadAudioMap(force) {
  try {
    const m = await run('de_audioMap');
    S.amap = m; store.set('de_amap', m); store.set('de_amap_t', Date.now());
  } catch (e) { if (force) toast(e.message); }
}
async function boot() {
  const get = f => fetch('data/' + f + '.json?v=' + V).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
  try {
    const [vocab, gram, speak, write] = await Promise.all(['vocab', 'grammar', 'speak', 'write'].map(get));
    S.D = { vocab, gram, speak, write };
  } catch (e) { $('#main').innerHTML = '<div class="card">Không tải được bài học. Kiểm tra mạng rồi tải lại trang.</div>'; return; }
  S.members = store.get('de_members', []);
  if (S.member) { loadLocal(S.member); $('#who').textContent = '👤 ' + S.member; } else defaults();
  render();
  try {
    const init = await run('de_init');
    S.members = init.members || []; S.family = init.progress || {}; S.audioStatus = init.audio || {};
    store.set('de_members', S.members);
    if (S.member && !S.members.find(m => m.name === S.member)) S.member = '';
    if (S.member) setMember(S.member);
    $('#sync').textContent = '✓';
  } catch (e) {
    $('#sync').textContent = '⚠︎';
    // Deutsch.gs chưa được triển khai → vẫn lấy danh sách thành viên từ app Einbürgerungskurs (đã có sẵn)
    try {
      const d = await run('getProgress');
      if (d && d.members && d.members.length) {
        S.members = d.members; store.set('de_members', S.members);
        if (S.member === 'Tôi' || !S.members.find(m => m.name === S.member)) { S.member = ''; store.set('de_member', ''); }
        else setMember(S.member);
      }
    } catch (e2) {}
    toast('Tiến độ tạm lưu trong máy – cần dán Deutsch.gs và triển khai phiên bản mới để lưu lên Sheet.');
    if (!S.members.length) S.members = [{ name: 'Tôi', icon: '🙂' }];
  }
  render();
  const age = Date.now() - store.get('de_amap_t', 0);
  if (!Object.keys(S.amap).length || age > 6 * 3600 * 1000) loadAudioMap();
}
boot();
</script>
